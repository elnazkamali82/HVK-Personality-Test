services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3010}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8000"
    environment:
      PANJRAKH_CORS_ORIGINS: '${PANJRAKH_CORS_ORIGINS:-["http://localhost:3010","http://127.0.0.1:3010"]}'
    restart: unless-stopped
