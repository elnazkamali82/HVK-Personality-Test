services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8010:8000"
    environment:
      PANJRAKH_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    restart: unless-stopped
